<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Garden photograph composition</title>
<desc id="desc">A woman stands behind a cut tree trunk in the bottom right corner. An older man appears in the centre in the distance, aligned with her outstretched hand. A bush is in front of the man, a flower wall is opposite the woman, trees are in the background, and a white house is in the top left corner.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dce9f0"/><stop offset="1" stop-color="#f1f4ef"/></linearGradient>
  <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa87d"/><stop offset="1" stop-color="#5f835d"/></linearGradient>
  <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b7354"/><stop offset="1" stop-color="#5f493b"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#20342e" flood-opacity=".16"/></filter>
</defs>
<!-- background -->
<rect width="1400" height="900" fill="url(#sky)"/>
<path d="M0 245 C170 170 300 235 440 175 C610 105 720 225 860 160 C1040 75 1190 155 1400 90 L1400 470 L0 470 Z" fill="#50735b"/>
<g opacity=".96">
  <circle cx="85" cy="218" r="88" fill="#42684e"/><circle cx="175" cy="180" r="105" fill="#587b59"/>
  <circle cx="306" cy="220" r="98" fill="#456d51"/><circle cx="525" cy="185" r="120" fill="#5c7e5d"/>
  <circle cx="720" cy="205" r="112" fill="#426a50"/><circle cx="920" cy="165" r="130" fill="#55765a"/>
  <circle cx="1120" cy="220" r="125" fill="#456c50"/><circle cx="1300" cy="170" r="130" fill="#52765b"/>
</g>
<!-- white house in top-left corner -->
<g filter="url(#shadow)">
  <rect x="58" y="105" width="360" height="170" rx="8" fill="#f7f8f4"/>
  <polygon points="40,115 235,24 445,115" fill="#6f7775"/>
  <rect x="90" y="145" width="64" height="55" fill="#9db9c1"/>
  <rect x="185" y="145" width="64" height="55" fill="#9db9c1"/>
  <rect x="280" y="145" width="64" height="55" fill="#9db9c1"/>
  <rect x="352" y="180" width="40" height="95" fill="#809490"/>
</g>
<!-- lawn / perspective -->
<path d="M0 385 C350 330 760 330 1400 405 L1400 900 L0 900 Z" fill="url(#lawn)"/>
<path d="M35 760 C380 610 630 540 920 485" fill="none" stroke="#a7b58e" stroke-width="80" stroke-linecap="round" opacity=".35"/>
<!-- flower wall opposite woman -->
<g filter="url(#shadow)">
  <path d="M0 410 L520 365 L535 500 L0 560 Z" fill="#b1a58a"/>
  <path d="M0 392 L520 345 L525 390 L0 438 Z" fill="#77796b"/>
  <g fill="#d7e0b9">
    <circle cx="65" cy="400" r="18"/><circle cx="125" cy="385" r="16"/><circle cx="188" cy="380" r="20"/>
    <circle cx="252" cy="374" r="14"/><circle cx="325" cy="366" r="18"/><circle cx="398" cy="360" r="16"/><circle cx="470" cy="353" r="20"/>
  </g>
  <g fill="#d1a0a8">
    <circle cx="95" cy="405" r="11"/><circle cx="220" cy="382" r="10"/><circle cx="365" cy="365" r="11"/><circle cx="440" cy="360" r="10"/>
  </g>
</g>
<!-- central distant older man -->
<g transform="translate(690 410)" filter="url(#shadow)">
  <ellipse cx="0" cy="114" rx="42" ry="12" fill="#3d5e49" opacity=".28"/>
  <circle cx="0" cy="0" r="28" fill="#d6b59a"/>
  <path d="M-24 -3 Q0 -32 24 -4 Q20 -32 0 -36 Q-18 -32 -24 -3" fill="#d8d8d3"/>
  <rect x="-28" y="28" width="56" height="82" rx="18" fill="#cad3ca"/>
  <rect x="-34" y="40" width="12" height="72" rx="6" fill="#d6b59a"/>
  <rect x="22" y="40" width="12" height="72" rx="6" fill="#d6b59a"/>
  <rect x="-21" y="105" width="15" height="68" rx="7" fill="#58685f"/>
  <rect x="6" y="105" width="15" height="68" rx="7" fill="#58685f"/>
</g>
<!-- bush in front of man -->
<g transform="translate(635 585)" filter="url(#shadow)">
  <circle cx="0" cy="0" r="70" fill="#3f6949"/><circle cx="58" cy="-15" r="62" fill="#4c7753"/><circle cx="100" cy="15" r="54" fill="#3d6647"/>
  <circle cx="35" cy="35" r="58" fill="#557f59"/><circle cx="88" cy="48" r="48" fill="#436e4c"/>
</g>
<!-- woman in foreground behind trunk -->
<g transform="translate(1115 350)" filter="url(#shadow)">
  <!-- legs -->
  <path d="M-5 305 L48 305 L72 520 L30 520 Z" fill="#405362"/>
  <path d="M55 305 L105 305 L132 520 L92 520 Z" fill="#405362"/>
  <!-- torso -->
  <path d="M-35 90 Q45 50 120 105 L105 335 L-10 330 Z" fill="#28363e"/>
  <!-- head / hair -->
  <circle cx="45" cy="35" r="52" fill="#bd8a6e"/>
  <path d="M-3 28 Q7 -35 65 -24 Q118 -10 99 48 Q88 10 53 4 Q20 2 -3 28" fill="#1e2528"/>
  <!-- left arm to trunk -->
  <path d="M85 125 Q125 205 115 295" stroke="#bd8a6e" stroke-width="32" fill="none" stroke-linecap="round"/>
  <ellipse cx="114" cy="305" rx="24" ry="17" fill="#bd8a6e"/>
  <!-- right arm outstretched, palm under distant man -->
  <path d="M-8 128 Q-130 205 -260 232 Q-340 248 -390 230" stroke="#bd8a6e" stroke-width="31" fill="none" stroke-linecap="round"/>
  <ellipse cx="-408" cy="225" rx="48" ry="22" fill="#bd8a6e" transform="rotate(-7 -408 225)"/>
</g>
<!-- cut tree trunk in bottom right-hand corner, in front of woman -->
<g filter="url(#shadow)">
  <path d="M1170 650 C1215 605 1320 610 1360 658 L1345 900 L1145 900 Z" fill="url(#trunk)"/>
  <ellipse cx="1260" cy="650" rx="102" ry="47" fill="#c39a72"/>
  <ellipse cx="1260" cy="650" rx="74" ry="31" fill="none" stroke="#8e6c52" stroke-width="7"/>
  <ellipse cx="1260" cy="650" rx="46" ry="18" fill="none" stroke="#9d7758" stroke-width="5"/>
  <path d="M1198 628 Q1250 670 1318 628" fill="none" stroke="#d8b38d" stroke-width="6"/>
</g>
<!-- subtle foreground hedge -->
<g opacity=".75">
  <circle cx="150" cy="720" r="115" fill="#355e44"/><circle cx="290" cy="755" r="130" fill="#426b4d"/><circle cx="420" cy="730" r="95" fill="#527a56"/>
</g>
</svg>